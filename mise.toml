[env]
_.file = [".env"]
_.path = [".mise/scripts", "agents/hermes/pm", "agents/hermes/pm/hermes"]

# This block will handle the linking of
# agent files to the main AGENTS.md file.
#
# TODO: Ensure this works for all levels of nesting.
# i.e. All linked agent files MUST be siblings at
# any given level of nesting.
[[hooks.enter]]
run = "'{{config_root}}/.mise/scripts/link-agentfiles.sh' '{{config_root}}'"
[[hooks.enter]]
run = "'{{config_root}}/.mise/scripts/materialize-env.sh'"

[tasks.install]
description = "Install Python dependencies"
run = "pip install -e '.[dev]'"

[tasks.start]
description = "Start candystore API + ingestion server"
run = "python -m candystore.main"

[tasks.test]
description = "Run pytest suite"
run = "pytest tests/ -v"

[tasks."test:schema"]
description = "Validate DB migrations against DATABASE_URL"
run = "bash tests/migration_test.sh"

[tasks.lint]
description = "Run ruff"
run = "ruff check candystore/ tests/"

[tasks."cli:install"]
description = "Install the CandyStore CLI for shells and agent startup hooks"
run = "bash '{{config_root}}/.mise/scripts/install-context-cli.sh'"

[tasks."context:latest"]
description = "Recover this project's latest work across agent CLIs"
run = "candystore context latest"

[tasks."deploy:app"]
description = "Build and recreate only the installed platform CandyStore app"
run = "docker compose -f '{{config_root}}/../33god-platform/compose.yaml' up -d --build --no-deps candystore"

[tasks."migrate:context"]
description = "Create context lookup indexes online before recreating the app"
run = """
sed 's/CREATE INDEX IF NOT EXISTS/CREATE INDEX CONCURRENTLY IF NOT EXISTS/' '{{config_root}}/migrations/008_context_native_sessions.sql' | docker compose -f '{{config_root}}/../33god-platform/compose.yaml' exec -T candystore-postgres psql -U candystore -d candystore -v ON_ERROR_STOP=1
docker compose -f '{{config_root}}/../33god-platform/compose.yaml' exec -T candystore-postgres psql -U candystore -d candystore -v ON_ERROR_STOP=1 -c 'ANALYZE events'
"""

[tasks."project:sync"]
description = "Resolve trail working directories to pjangler registry projects"
run = "python -m candystore.projects"

[tasks."build:ui"]
description = "Build React SPA into static/"
run = "cd web && npm run build"

[tasks.up]
description = "Boot the full stack (postgres + app + daprd)"
run = "docker compose up -d --build --remove-orphans"

[tasks.down]
description = "Stop the stack (volumes preserved)"
run = "docker compose down --remove-orphans"

[tasks.logs]
description = "Tail stack logs"
run = "docker compose logs -f --tail=100"

[[watch_files]]
patterns = ["AGENTS.md"]
task = "link:agentfiles"

[tasks."link:agentfiles"]
description = "Symlink all agent files to AGENTS.md"
run = "'{{config_root}}/.mise/scripts/link-agentfiles.sh' '{{config_root}}'"

[tasks."skills:sync"]
description = "Reconcile this project's selected skills"
tools = { "npm:@delorenj/skillex" = { version = "0.1.1", allow_low_downloads = true }, node = "24" }
run = "skillex sync --scope project --project '{{config_root}}'"

# >>> mise-versioning >>>  (managed block — do not edit by hand; re-run init to update)
[tasks."version"]
description = "Print the current version (vX.Y.Z)"
run = "'{{config_root}}/.mise/scripts/versioning.sh' current"

[tasks."version:bump"]
description = "Bump patch version: vX.Y.Z -> vX.Y.(Z+1)"
alias = "version:bump-patch"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump patch"

[tasks."version:bump-minor"]
description = "Bump minor version: vX.Y.Z -> vX.(Y+1).0"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump minor"

[tasks."version:bump-major"]
description = "Bump major version: vX.Y.Z -> v(X+1).0.0"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump major"

[tasks."version:check"]
description = "Verify every versioned file is in parity"
run = "'{{config_root}}/.mise/scripts/versioning.sh' check"

[tasks."version:sync"]
description = "Force every versioned file up to the highest version"
run = "'{{config_root}}/.mise/scripts/versioning.sh' sync"
# <<< mise-versioning <<<
