[env]
_.file = [".env"]

[tasks.start]
description = "Start the Candystore Server"
run = "uv run candystore serve"
alias = "start"

[tasks.test]
description = "Run pytest suite"
run = "uv run --extra test pytest tests/"

[tasks.lint]
description = "Run ruff against src-layout package and tests"
run = "uv run --extra test ruff check --exit-zero src/candystore tests"
